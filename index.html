<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>index.html</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5fb;--surface:#fff;--surface2:#f9f7fd;
  --border:#ebe7f5;--border2:#d4cdf0;
  --text:#1e1a2e;--text2:#6b6488;--text3:#a99fc0;
  --accent:#8b7fd4;--accent-l:#f0eefb;--accent-b:#d4cdf0;
  --danger:#7a1e1e;--danger-bg:#fde8e8;
  --info:#0f3d6e;--info-bg:#e6f0fb;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}

/* ── 로그인 화면 ── */
.login-screen{position:fixed;inset:0;background:var(--accent);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:0}
.login-box{background:#fff;border-radius:20px;padding:48px 40px;width:380px;max-width:90vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-logo{font-size:32px;margin-bottom:12px}
.login-box h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:32px;line-height:1.6}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;border:1.5px solid var(--border2);border-radius:var(--rl);background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s}
.google-btn:hover{background:var(--surface2);border-color:var(--accent-b)}
.google-btn img{width:20px;height:20px}
.login-footer{margin-top:20px;font-size:11px;color:var(--text3)}

/* ── 앱 ── */
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}

.sidebar{background:var(--accent);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sb-logo{padding:22px 20px 16px;border-bottom:.5px solid rgba(255,255,255,.1)}
.sb-logo h1{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px}
.sb-user{display:flex;align-items:center;gap:8px;margin-top:8px}
.sb-user-avatar{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3)}
.sb-user-name{font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.sb-sync{font-size:10px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:5px;margin-top:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0;animation:pulse 2s infinite}
.sync-dot.off{background:#f87171;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sb-nav{padding:14px 10px;flex:1;overflow-y:auto}
.sb-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.35);text-transform:uppercase;padding:0 10px;margin:14px 0 5px}
.sb-btn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:rgba(255,255,255,.65);font-family:inherit;font-size:13px;padding:8px 10px;border-radius:var(--r);cursor:pointer;text-align:left;transition:background .15s,color .15s}
.sb-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.sb-btn.active{background:rgba(255,255,255,.15);color:#fff;font-weight:500}
.sb-btn svg{width:14px;height:14px;flex-shrink:0}
.sb-foot{padding:12px 20px;border-top:.5px solid rgba(255,255,255,.1)}
.logout-btn{display:flex;align-items:center;gap:7px;width:100%;background:none;border:.5px solid rgba(255,255,255,.2);border-radius:var(--r);color:rgba(255,255,255,.55);font-family:inherit;font-size:12px;padding:7px 10px;cursor:pointer;transition:all .15s}
.logout-btn:hover{background:rgba(255,255,255,.08);color:#fff}

.main{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:.5px solid var(--border);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-title{font-size:15px;font-weight:700}
.tb-badge{font-size:11px;font-weight:600;background:var(--accent-l);color:var(--accent);padding:2px 10px;border-radius:20px;border:.5px solid var(--accent-b)}
.tb-right{display:flex;gap:7px}

.btn{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:13px;font-weight:500;padding:7px 13px;border-radius:var(--r);cursor:pointer;border:.5px solid var(--border2);background:var(--surface);color:var(--text2);transition:background .13s,color .13s}
.btn:hover{background:var(--surface2);color:var(--text)}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#4a3fb8;color:#fff}
.btn-sm{font-size:12px;padding:5px 10px}
.btn-danger{color:var(--danger);border-color:#e8a0a0}
.btn-danger:hover{background:var(--danger-bg)}

.page{padding:28px;max-width:860px;display:none}
.page.active{display:block}

.card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:22px;margin-bottom:14px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:.5px solid var(--border)}
.card-title{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--text);display:flex;align-items:center;gap:7px}
.card-title svg{width:14px;height:14px;color:var(--text3)}

.fg{display:grid;gap:12px;margin-bottom:12px}
.fg.c3{grid-template-columns:1fr 1fr 1fr}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=date],select,textarea{width:100%;font-family:inherit;font-size:13px;color:var(--text);background:var(--surface2);border:.5px solid var(--border);border-radius:var(--r);padding:8px 10px;outline:none;transition:border-color .13s,background .13s}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--border2);background:#fff;box-shadow:0 0 0 3px rgba(91,79,207,.07)}
textarea{resize:vertical;line-height:1.6}
select{cursor:pointer}

.ag-bubble{display:flex;gap:9px;margin-bottom:10px;align-items:flex-start}
.ag-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.85);font-weight:600;background:var(--accent);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.ag-body{flex:1;background:var(--surface2);border:.5px solid var(--border);border-radius:2px var(--rl) var(--rl) var(--rl);padding:10px 13px}
.ag-body.editing{background:#fff;border-color:var(--border2)}
.ag-speaker{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
.ag-text{font-size:13px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-all}
.ag-actions{display:flex;gap:4px;margin-top:7px;justify-content:flex-end}
.ag-act-btn{font-family:inherit;font-size:11px;background:none;border:.5px solid var(--border);border-radius:5px;padding:2px 8px;cursor:pointer;color:var(--text3);transition:all .12s}
.ag-act-btn:hover{background:var(--surface);color:var(--text2)}
.ag-act-btn.del:hover{color:var(--danger);border-color:var(--danger)}
.ag-edit-wrap{display:flex;flex-direction:column;gap:7px}
.ag-edit-wrap textarea{min-height:64px}

.ag-input-area{display:flex;gap:9px;align-items:flex-start;margin-top:4px;padding-top:14px;border-top:.5px solid var(--border)}
.ag-input-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.7);font-weight:600;background:var(--border2);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.ag-input-box{flex:1;background:var(--surface2);border:.5px solid var(--border);border-radius:var(--rl);padding:10px 13px;transition:border-color .13s}
.ag-input-box:focus-within{border-color:var(--border2);background:#fff}
.ag-input-box input{margin-bottom:7px}
.ag-input-box textarea{border:none;background:transparent;min-height:56px;resize:none;outline:none;font-family:inherit;font-size:13px;color:var(--text);width:100%;line-height:1.6}
.ag-input-footer{display:flex;justify-content:flex-end;margin-top:5px}

.c-bubble{display:flex;gap:9px;margin-bottom:10px;align-items:flex-start}
.c-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.c-body{flex:1;background:var(--surface2);border:.5px solid var(--border);border-radius:2px var(--rl) var(--rl) var(--rl);padding:10px 13px}
.c-body.editing{background:#fff;border-color:var(--border2)}
.c-meta{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.c-author{font-size:12px;font-weight:700}
.c-topic{font-size:11px;color:var(--accent);background:var(--accent-l);border:.5px solid var(--accent-b);padding:1px 7px;border-radius:20px}
.c-date{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-left:auto}
.c-text{font-size:13px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-all}
.c-actions{display:flex;gap:4px;margin-top:7px;justify-content:flex-end}
.c-act-btn{font-family:inherit;font-size:11px;background:none;border:.5px solid var(--border);border-radius:5px;padding:2px 8px;cursor:pointer;color:var(--text3);transition:all .12s}
.c-act-btn:hover{background:var(--surface);color:var(--text2)}
.c-act-btn.del:hover{color:var(--danger);border-color:var(--danger)}
.c-edit-wrap{display:flex;flex-direction:column;gap:7px}
.c-edit-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.c-edit-wrap textarea{min-height:64px}

.c-input-area{display:flex;gap:9px;align-items:flex-start;margin-top:4px;padding-top:14px;border-top:.5px solid var(--border)}
.c-input-box{flex:1;background:var(--surface2);border:.5px solid var(--border);border-radius:var(--rl);padding:10px 13px;transition:border-color .13s}
.c-input-box:focus-within{border-color:var(--border2);background:#fff}
.c-input-fields{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.c-input-box textarea{border:none;background:transparent;min-height:56px;resize:none;outline:none;font-family:inherit;font-size:13px;color:var(--text);width:100%;line-height:1.6}
.c-input-footer{display:flex;justify-content:flex-end;margin-top:5px}

.badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;background:var(--surface2);border:.5px solid var(--border);color:var(--text3);padding:1px 8px;border-radius:20px}
.editing-badge{font-size:11px;font-weight:500;color:var(--info);background:var(--info-bg);padding:2px 8px;border-radius:20px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#fff;font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--rl);box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:999;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.list-row{border:.5px solid var(--border);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:11px;transition:background .1s}
.list-row:hover{background:var(--surface2)}
.list-info{flex:1;min-width:0;cursor:pointer}
.list-chips{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.list-chip{font-size:11px;font-weight:600;background:var(--accent-l);color:var(--accent);padding:2px 8px;border-radius:20px;border:.5px solid var(--accent-b)}
.list-date{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3)}
.list-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:11px;color:var(--text3)}
.list-btns{display:flex;gap:5px;flex-shrink:0}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">📋</div>
    <h1>DSI 회의록</h1>
    <p>팀 내부 회의록 및 코멘트 시스템입니다.<br>Google 계정으로 로그인해주세요.</p>
    <button class="google-btn" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Google 계정으로 로그인
    </button>
    <div class="login-footer">승인된 팀원만 접근 가능합니다</div>
  </div>
</div>

<!-- 앱 -->
<div class="app" id="main-app" style="display:none">
<aside class="sidebar">
  <div class="sb-logo">
    <h1>DSI 회의록</h1>
    <div class="sb-user">
      <img class="sb-user-avatar" id="user-photo" src="" alt="">
      <span class="sb-user-name" id="user-name">-</span>
    </div>
    <div class="sb-sync"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">동기화 중</span></div>
  </div>
  <nav class="sb-nav">
    <div class="sb-label">메뉴</div>
    <button class="sb-btn active" id="nav-write" onclick="showPage('write')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      새 회의록 작성
    </button>
    <button class="sb-btn" id="nav-list" onclick="showPage('list')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      저장된 회의록
    </button>
    <div class="sb-label">구분</div>
    <button class="sb-btn" onclick="filterList('주간보고')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      주간보고
    </button>
    <button class="sb-btn" onclick="filterList('월말보고')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      월말보고
    </button>
    <div class="sb-label">알림</div>
    <button class="sb-btn" onclick="requestNotif()" id="notif-btn">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="notif-label">알림 켜기</span>
    </button>
  </nav>
  <div class="sb-foot">
    <button class="logout-btn" onclick="logout()">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      로그아웃
    </button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="tb-left">
      <span class="tb-title" id="tb-title">새 회의록 작성</span>
      <span class="tb-badge" id="tb-badge">주간보고</span>
    </div>
    <div class="tb-right">
      <button class="btn" onclick="newMeeting()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        새 회의록
      </button>
      <button class="btn" onclick="exportTxt()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        내보내기
      </button>
      <button class="btn btn-primary" id="btn-save" onclick="saveMeeting()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        저장
      </button>
    </div>
  </div>

  <div class="page active" id="page-write">
    <div class="card">
      <div class="card-hd">
        <div class="card-title">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          기본 정보
        </div>
      </div>
      <div class="fg c3">
        <div class="field"><label>회의일자</label><input type="date" id="f-date" onchange="onDateChange()"></div>
        <div class="field"><label>구분</label>
          <select id="f-type" onchange="onTypeChange()"><option>주간보고</option><option>월말보고</option></select>
        </div>
        <div class="field"><label>작성자</label><input type="text" id="f-writer" placeholder="예) 승리"></div>
      </div>
      <div class="field"><label>제목</label><input type="text" id="f-title" placeholder="예) 5월 2주차 주간보고" style="font-size:15px;font-weight:600"></div>
    </div>

    <div class="card">
      <div class="card-hd">
        <div class="card-title">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          주요 논의 사항
        </div>
        <span class="badge" id="ag-count">0</span>
      </div>
      <div id="agenda-list"></div>
      <div class="ag-input-area">
        <div class="ag-input-num">+</div>
        <div class="ag-input-box">
          <input type="text" id="ai-speaker" placeholder="발언자 (선택사항)">
          <textarea id="ai-body" placeholder="논의 내용을 입력하세요…" rows="2"></textarea>
          <div class="ag-input-footer">
            <button class="btn btn-primary" onclick="submitAgenda()" style="font-size:12px;padding:5px 13px">등록</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">
        <div class="card-title">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          결정 사항
        </div>
      </div>
      <textarea id="f-decisions" style="min-height:88px" placeholder="최종 결정된 사항을 정리하세요"></textarea>
    </div>

    <div class="card">
      <div class="card-hd">
        <div class="card-title">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          후속 코멘트
        </div>
        <span class="badge" id="c-count">0</span>
      </div>
      <div id="comment-list"></div>
      <div class="c-input-area">
        <div class="c-avatar" id="ci-avatar">?</div>
        <div class="c-input-box">
          <div class="c-input-fields">
            <input type="text" id="ci-author" placeholder="작성자" oninput="ciAvatarUpdate()">
            <select id="ci-topic"><option value="">— 논의 항목 선택 (선택사항) —</option></select>
          </div>
          <textarea id="ci-body" placeholder="코멘트를 입력하세요…" rows="2"></textarea>
          <div class="c-input-footer">
            <button class="btn btn-primary" onclick="submitComment()" style="font-size:12px;padding:5px 13px">등록</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="page" id="page-list">
    <div class="card">
      <div class="card-hd">
        <div class="card-title">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
          저장된 회의록
        </div>
        <span class="badge" id="list-count">0</span>
      </div>
      <div id="list-body"></div>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }       from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue, remove }
                                from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
                                from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ── Firebase 설정 (승리 프로젝트) ──
const firebaseConfig = {
  apiKey:      "AIzaSyAf72s0sbzIkee0b30sMLanqQuUxLZjUnQ",
  authDomain:  "dsi-bc718.firebaseapp.com",
  databaseURL: "https://dsi-bc718-default-rtdb.firebaseio.com",
  projectId:   "dsi-bc718",
  storageBucket:"dsi-bc718.firebasestorage.app",
  messagingSenderId:"603412008086",
  appId:       "1:603412008086:web:db3d6c7752a0c2878806b7"
};

const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

var TODAY = new Date().toISOString().slice(0,10);
var editingId=null, agendaSeq=0, commentSeq=0, agendaData=[];
var currentUser = null;
var isFirstLoad = true;

// ── 인증 ──
window.googleLogin = function(){
  signInWithPopup(auth, provider).catch(function(e){ alert('로그인 실패: '+e.message); });
};

window.logout = function(){
  if(!confirm('로그아웃 할까요?')) return;
  signOut(auth);
};

onAuthStateChanged(auth, function(user){
  if(user){
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'grid';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    var photo = document.getElementById('user-photo');
    if(user.photoURL){ photo.src=user.photoURL; photo.style.display=''; }
    else { photo.style.display='none'; }
    // 작성자 자동 입력 — Google 이름 그대로
    var name = user.displayName || user.email || '';
    document.getElementById('f-writer').value = name;
    document.getElementById('ci-author').value = name;
    document.getElementById('ci-avatar').textContent = name ? name[0].toUpperCase() : '?';
    initApp();
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-app').style.display = 'none';
  }
});

// ── Firebase 실시간 리스너 ──
function initApp(){
  document.getElementById('f-date').value = TODAY;
  autoTitle();

  onValue(ref(db,'meetings'), function(snap){
    var data = snap.val() || {};
    var list = Object.values(data).sort(function(a,b){ return b.savedAt > a.savedAt ? 1 : -1; });
    localStorage.setItem('dsi_v2', JSON.stringify(list));

    // 알림 (첫 로드 제외)
    if(!isFirstLoad && Notification.permission==='granted'){
      new Notification('DSI 회의록 업데이트', {
        body: '새로운 변경사항이 있습니다.',
        icon: ''
      });
    }
    isFirstLoad = false;

    if(document.getElementById('page-list').classList.contains('active')) renderList();
    document.getElementById('sync-dot').className='sync-dot';
    document.getElementById('sync-label').textContent='실시간 동기화 중';
  });
}

// ── 알림 ──
window.requestNotif = function(){
  if(!('Notification' in window)){ alert('이 브라우저는 알림을 지원하지 않아요.'); return; }
  Notification.requestPermission().then(function(p){
    if(p==='granted'){ document.getElementById('notif-label').textContent='알림 켜짐 ✓'; showToast('브라우저 알림이 켜졌어요'); }
    else { document.getElementById('notif-label').textContent='알림 차단됨'; showToast('브라우저 설정에서 알림을 허용해주세요'); }
  });
};

// ── storage ──
function dbLoad(){ try{ return JSON.parse(localStorage.getItem('dsi_v2')||'[]'); }catch(e){ return []; } }
function dbSave(list){
  localStorage.setItem('dsi_v2', JSON.stringify(list));
  list.forEach(function(m){ set(ref(db,'meetings/'+m.id), m); });
}
function dbDelete(id){
  var list=dbLoad().filter(function(x){ return x.id!==id; });
  localStorage.setItem('dsi_v2', JSON.stringify(list));
  remove(ref(db,'meetings/'+id));
}

// ── pages ──
window.showPage = function(p){
  document.getElementById('page-write').classList.toggle('active', p==='write');
  document.getElementById('page-list').classList.toggle('active', p==='list');
  document.getElementById('nav-write').classList.toggle('active', p==='write');
  document.getElementById('nav-list').classList.toggle('active', p==='list');
  if(p==='list'){
    document.getElementById('tb-title').textContent='저장된 회의록';
    document.getElementById('tb-badge').style.display='none';
    renderList();
  } else {
    document.getElementById('tb-title').textContent=editingId?'회의록 수정':'새 회의록 작성';
    document.getElementById('tb-badge').style.display='';
  }
};

function setSaveMode(e){ document.getElementById('btn-save').textContent=e?'업데이트':'저장'; }

// ── 자동 제목 ──
window.onDateChange = function(){ autoTitle(); };
window.onTypeChange = function(){
  document.getElementById('tb-badge').textContent=document.getElementById('f-type').value;
  autoTitle();
};
function autoTitle(){
  var val=document.getElementById('f-date').value; if(!val) return;
  var d=new Date(val+'T00:00:00'), month=d.getMonth()+1;
  var first=new Date(d.getFullYear(),d.getMonth(),1), fd=first.getDay();
  var firstMon=new Date(first); firstMon.setDate(1+(fd===0?-6:1-fd));
  var week=Math.max(1,Math.floor((d-firstMon)/(7*864e5))+1);
  var type=document.getElementById('f-type').value;
  var el=document.getElementById('f-title');
  if(!el.value||/^\d+월 \d+주차/.test(el.value)) el.value=month+'월 '+week+'주차 '+type;
}

// ── 논의 항목 ──
function addAgendaBubble(data){
  agendaSeq++; var seq=agendaSeq;
  var entry={id:seq,speaker:data.speaker||'',body:data.body||''};
  agendaData.push(entry);
  var list=document.getElementById('agenda-list');
  var wrap=document.createElement('div'); wrap.className='ag-bubble'; wrap.id='agb-'+seq;
  var numEl=document.createElement('div'); numEl.className='ag-num'; numEl.textContent=seq;
  var body=document.createElement('div'); body.className='ag-body';

  function showView(){
    body.classList.remove('editing'); body.innerHTML='';
    if(entry.speaker){ var sp=document.createElement('div'); sp.className='ag-speaker'; sp.textContent=entry.speaker; body.appendChild(sp); }
    var txt=document.createElement('div'); txt.className='ag-text'; txt.textContent=entry.body; body.appendChild(txt);
    var acts=document.createElement('div'); acts.className='ag-actions';
    var eBtn=document.createElement('button'); eBtn.className='ag-act-btn'; eBtn.textContent='수정'; eBtn.addEventListener('click',showEdit);
    var dBtn=document.createElement('button'); dBtn.className='ag-act-btn del'; dBtn.textContent='삭제';
    dBtn.addEventListener('click',function(){ agendaData=agendaData.filter(function(a){ return a.id!==seq; }); wrap.remove(); renumberAgendas(); syncTopicDrop(); updateAgCount(); });
    acts.append(eBtn,dBtn); body.appendChild(acts);
  }
  function showEdit(){
    body.classList.add('editing'); body.innerHTML='';
    var ew=document.createElement('div'); ew.className='ag-edit-wrap';
    var iSp=document.createElement('input'); iSp.type='text'; iSp.value=entry.speaker; iSp.placeholder='발언자 (선택사항)';
    var ta=document.createElement('textarea'); ta.value=entry.body; ta.placeholder='논의 내용을 입력하세요';
    var foot=document.createElement('div'); foot.style.cssText='display:flex;gap:5px;justify-content:flex-end;margin-top:4px';
    var cBtn=document.createElement('button'); cBtn.className='ag-act-btn'; cBtn.textContent='취소'; cBtn.addEventListener('click',showView);
    var sBtn=document.createElement('button'); sBtn.className='btn btn-primary'; sBtn.style.cssText='font-size:11px;padding:4px 11px'; sBtn.textContent='저장';
    sBtn.addEventListener('click',function(){ entry.speaker=iSp.value.trim(); entry.body=ta.value.trim(); showView(); syncTopicDrop(); });
    foot.append(cBtn,sBtn); ew.append(iSp,ta,foot); body.appendChild(ew); ta.focus();
  }
  showView(); wrap.append(numEl,body); list.appendChild(wrap);
  syncTopicDrop(); updateAgCount();
}

function renumberAgendas(){
  document.querySelectorAll('#agenda-list .ag-bubble').forEach(function(b,i){ var n=b.querySelector('.ag-num'); if(n) n.textContent=i+1; });
}
function updateAgCount(){
  document.getElementById('ag-count').textContent=document.getElementById('agenda-list').querySelectorAll('.ag-bubble').length;
}
window.submitAgenda = function(){
  var speaker=document.getElementById('ai-speaker').value.trim();
  var body=document.getElementById('ai-body').value.trim();
  if(!body){ document.getElementById('ai-body').focus(); return; }
  addAgendaBubble({speaker:speaker,body:body});
  document.getElementById('ai-body').value='';
  document.getElementById('ai-speaker').value='';
};

function syncTopicDrop(){
  var sel=document.getElementById('ci-topic'); if(!sel) return;
  var prev=sel.value;
  sel.innerHTML='<option value="">— 논의 항목 선택 (선택사항) —</option>';
  agendaData.forEach(function(a,i){
    if(!a.body) return;
    var opt=document.createElement('option'); opt.value=a.body;
    var label=(a.speaker?'['+a.speaker+'] ':'')+a.body;
    opt.textContent=String(i+1).padStart(2,'0')+' '+(label.length>34?label.slice(0,34)+'…':label);
    sel.appendChild(opt);
  });
  if([...sel.options].some(function(o){ return o.value===prev; })) sel.value=prev;
}

function buildTopicSel(cur){
  var sel=document.createElement('select'); sel.style.fontSize='12px';
  var def=document.createElement('option'); def.value=''; def.textContent='— 논의 항목 선택 —'; sel.appendChild(def);
  agendaData.forEach(function(a,i){
    if(!a.body) return;
    var opt=document.createElement('option'); opt.value=a.body;
    var label=(a.speaker?'['+a.speaker+'] ':'')+a.body;
    opt.textContent=String(i+1).padStart(2,'0')+' '+(label.length>32?label.slice(0,32)+'…':label);
    if(a.body===cur) opt.selected=true;
    sel.appendChild(opt);
  });
  if(cur&&![...sel.options].some(function(o){ return o.value===cur; })){ var c=document.createElement('option'); c.value=cur; c.textContent=cur; c.selected=true; sel.appendChild(c); }
  return sel;
}

// ── 코멘트 ──
window.ciAvatarUpdate = function(){
  var v=document.getElementById('ci-author').value.trim();
  document.getElementById('ci-avatar').textContent=v?v[0].toUpperCase():'?';
};

window.submitComment = function(){
  var author=document.getElementById('ci-author').value.trim();
  var topic=document.getElementById('ci-topic').value.trim();
  var body=document.getElementById('ci-body').value.trim();
  if(!body){ document.getElementById('ci-body').focus(); return; }
  addCommentBubble({author:author,topic:topic,body:body,date:TODAY});
  document.getElementById('ci-body').value='';
  var name = currentUser ? (currentUser.displayName || currentUser.email || '') : '';
  document.getElementById('ci-author').value = name;
  document.getElementById('ci-avatar').textContent = name ? name[0].toUpperCase() : '?';
  document.getElementById('ci-topic').value='';
  updateCCount();
};

function addCommentBubble(c){
  commentSeq++;
  var list=document.getElementById('comment-list');
  var wrap=document.createElement('div'); wrap.className='c-bubble';
  var avatar=document.createElement('div'); avatar.className='c-avatar';
  avatar.textContent=c.author?c.author[0].toUpperCase():'?';
  var body=document.createElement('div'); body.className='c-body';

  function showView(){
    body.classList.remove('editing'); body.innerHTML='';
    var meta=document.createElement('div'); meta.className='c-meta';
    var auth=document.createElement('span'); auth.className='c-author'; auth.textContent=c.author||'익명'; meta.appendChild(auth);
    if(c.topic){ var t=document.createElement('span'); t.className='c-topic'; t.textContent=c.topic; meta.appendChild(t); }
    var dt=document.createElement('span'); dt.className='c-date'; dt.textContent=c.date||''; meta.appendChild(dt);
    body.appendChild(meta);
    var txt=document.createElement('div'); txt.className='c-text'; txt.textContent=c.body; body.appendChild(txt);
    var acts=document.createElement('div'); acts.className='c-actions';
    var eBtn=document.createElement('button'); eBtn.className='c-act-btn'; eBtn.textContent='수정'; eBtn.addEventListener('click',showEdit);
    var dBtn=document.createElement('button'); dBtn.className='c-act-btn del'; dBtn.textContent='삭제';
    dBtn.addEventListener('click',function(){ wrap.remove(); updateCCount(); });
    acts.append(eBtn,dBtn); body.appendChild(acts);
  }
  function showEdit(){
    body.classList.add('editing'); body.innerHTML='';
    var ew=document.createElement('div'); ew.className='c-edit-wrap';
    var row=document.createElement('div'); row.className='c-edit-row';
    var iA=document.createElement('input'); iA.type='text'; iA.value=c.author||''; iA.placeholder='작성자';
    var iT=buildTopicSel(c.topic); row.append(iA,iT);
    var ta=document.createElement('textarea'); ta.value=c.body||''; ta.placeholder='내용을 입력하세요';
    var foot=document.createElement('div'); foot.style.cssText='display:flex;gap:5px;justify-content:flex-end;margin-top:4px';
    var cBtn=document.createElement('button'); cBtn.className='c-act-btn'; cBtn.textContent='취소'; cBtn.addEventListener('click',showView);
    var sBtn=document.createElement('button'); sBtn.className='btn btn-primary'; sBtn.style.cssText='font-size:11px;padding:4px 11px'; sBtn.textContent='저장';
    sBtn.addEventListener('click',function(){ c.author=iA.value.trim(); c.topic=iT.value.trim(); c.body=ta.value.trim(); avatar.textContent=c.author?c.author[0].toUpperCase():'?'; showView(); });
    foot.append(cBtn,sBtn); ew.append(row,ta,foot); body.appendChild(ew); ta.focus();
  }
  showView(); wrap.append(avatar,body); list.appendChild(wrap);
}
function updateCCount(){
  document.getElementById('c-count').textContent=document.getElementById('comment-list').querySelectorAll('.c-bubble').length;
}

// ── gather ──
function gather(){
  var agendas=agendaData.map(function(a){ return {speaker:a.speaker,body:a.body}; });
  var comments=[...document.querySelectorAll('#comment-list .c-bubble')].map(function(b){ return {
    author:(b.querySelector('.c-author')||{}).textContent||'',
    topic:(b.querySelector('.c-topic')||{}).textContent||'',
    date:(b.querySelector('.c-date')||{}).textContent||'',
    body:(b.querySelector('.c-text')||{}).textContent||''
  }; });
  return { id:editingId||Date.now(), savedAt:new Date().toISOString(),
    date:document.getElementById('f-date').value, type:document.getElementById('f-type').value,
    title:document.getElementById('f-title').value, writer:document.getElementById('f-writer').value,
    decisions:document.getElementById('f-decisions').value, agendas:agendas, comments:comments };
}

// ── save ──
window.saveMeeting = function(){
  var data=gather(), list=dbLoad();
  if(editingId){
    var idx=list.findIndex(function(x){ return x.id===editingId; });
    if(idx>=0) list[idx]=data; else list.unshift(data);
    dbSave(list); showToast('업데이트 완료 ☁️');
  } else {
    data.id=Date.now(); editingId=data.id;
    list.unshift(data); dbSave(list);
    setSaveMode(true); document.getElementById('tb-title').textContent='회의록 수정';
    showToast('저장 완료 ☁️');
  }
};

// ── new ──
window.newMeeting = function(){
  if(!confirm('새 회의록을 작성할까요?')) return;
  editingId=null; agendaSeq=0; commentSeq=0; agendaData=[];
  setSaveMode(false);
  document.getElementById('f-date').value=TODAY;
  ['f-title','f-decisions'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('f-writer').value='';
  document.getElementById('f-type').selectedIndex=0;
  document.getElementById('agenda-list').innerHTML='';
  document.getElementById('comment-list').innerHTML='';
  document.getElementById('ai-body').value=''; document.getElementById('ai-speaker').value='';
  document.getElementById('ci-body').value=''; document.getElementById('ci-author').value='';
  document.getElementById('ci-avatar').textContent='?';
  document.getElementById('ci-topic').innerHTML='<option value="">— 논의 항목 선택 (선택사항) —</option>';
  document.getElementById('tb-badge').textContent='주간보고';
  document.getElementById('tb-badge').style.display='';
  document.getElementById('tb-title').textContent='새 회의록 작성';
  updateAgCount(); updateCCount(); autoTitle(); showPage('write');
};

// ── load ──
function loadMeeting(id){
  var m=dbLoad().find(function(x){ return x.id===id; }); if(!m) return;
  editingId=id; agendaSeq=0; commentSeq=0; agendaData=[];
  setSaveMode(true);
  document.getElementById('f-date').value=m.date||'';
  document.getElementById('f-type').value=m.type||'주간보고';
  document.getElementById('f-title').value=m.title||'';
  document.getElementById('f-writer').value=m.writer||'';
  document.getElementById('f-decisions').value=m.decisions||'';
  document.getElementById('tb-badge').textContent=m.type||'주간보고';
  document.getElementById('agenda-list').innerHTML='';
  document.getElementById('comment-list').innerHTML='';
  (m.agendas||[]).forEach(function(a){ addAgendaBubble(a); });
  syncTopicDrop();
  (m.comments||[]).forEach(function(c){ addCommentBubble(c); });
  updateCCount(); showPage('write');
  document.getElementById('tb-title').textContent='회의록 수정';
  document.getElementById('tb-badge').style.display='';
  window.scrollTo(0,0);
}

// ── delete ──
function deleteMeeting(id,e){
  e.stopPropagation();
  if(!confirm('이 회의록을 삭제할까요?')) return;
  dbDelete(id);
  if(editingId===id){ editingId=null; setSaveMode(false); }
  showToast('삭제 완료'); renderList();
}

// ── list ──
function renderList(filter){
  var all=dbLoad();
  var items=filter?all.filter(function(m){ return m.type===filter; }):all;
  document.getElementById('list-count').textContent=items.length;
  var body=document.getElementById('list-body');
  if(!items.length){ body.innerHTML='<p style="text-align:center;padding:36px 0;color:var(--text3);font-size:13px">저장된 회의록이 없습니다.</p>'; return; }
  body.innerHTML='';
  items.forEach(function(m){
    var savedStr=m.savedAt?new Date(m.savedAt).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    var row=document.createElement('div'); row.className='list-row';
    var info=document.createElement('div'); info.className='list-info';
    var chips=document.createElement('div'); chips.className='list-chips';
    var ds=document.createElement('span'); ds.className='list-date'; ds.textContent=m.date||''; chips.appendChild(ds);
    var ts=document.createElement('span'); ts.className='list-chip'; ts.textContent=m.type||''; chips.appendChild(ts);
    if((m.comments||[]).length){ var cc=document.createElement('span'); cc.style.cssText='font-size:11px;color:var(--text3)'; cc.textContent='💬 '+m.comments.length; chips.appendChild(cc); }
    var title=document.createElement('div'); title.className='list-title'; title.textContent=m.title||'(제목 없음)';
    var sub=document.createElement('div'); sub.className='list-sub';
    sub.textContent=(m.writer?'작성자: '+m.writer:'')+(savedStr?' · 저장 '+savedStr:'');
    info.append(chips,title,sub);
    info.addEventListener('click',function(){ loadMeeting(m.id); });
    var btns=document.createElement('div'); btns.className='list-btns';
    var eBtn=document.createElement('button'); eBtn.className='btn btn-sm'; eBtn.textContent='수정';
    eBtn.addEventListener('click',function(e){ e.stopPropagation(); loadMeeting(m.id); });
    var dBtn=document.createElement('button'); dBtn.className='btn btn-sm btn-danger'; dBtn.textContent='삭제';
    dBtn.addEventListener('click',function(e){ deleteMeeting(m.id,e); });
    btns.append(eBtn,dBtn); row.append(info,btns); body.appendChild(row);
  });
}

window.filterList = function(type){
  document.getElementById('nav-write').classList.remove('active');
  document.getElementById('nav-list').classList.add('active');
  document.getElementById('page-write').classList.remove('active');
  document.getElementById('page-list').classList.add('active');
  document.getElementById('tb-title').textContent=type;
  document.getElementById('tb-badge').style.display='none';
  renderList(type);
};

// ── export ──
window.exportTxt = function(){
  var d=gather();
  var t='═'.repeat(46)+'\n  '+d.type+(d.title?' · '+d.title:'')+'\n'+'═'.repeat(46)+'\n';
  t+='일자   : '+d.date+'\n작성자 : '+(d.writer||'-')+'\n\n';
  t+='【주요 논의 사항】\n';
  d.agendas.forEach(function(a,i){ t+=(i+1)+'. '+(a.speaker?'['+a.speaker+'] ':'')+a.body+'\n'; });
  t+='\n【결정 사항】\n'+(d.decisions||'-')+'\n';
  if(d.comments.length){ t+='\n【후속 코멘트】\n'; d.comments.forEach(function(c,i){ t+='─'.repeat(40)+'\n['+(i+1)+'] '+(c.date||'')+' | '+(c.author||'')+(c.topic?' | '+c.topic:'')+'\n'+(c.body||'')+'\n'; }); }
  t+='═'.repeat(46)+'\n';
  var blob=new Blob([t],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='DSI_회의록_'+(d.date||'draft')+'.txt';
  a.click(); URL.revokeObjectURL(url);
};

// ── toast ──
function showToast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); },2200);
}
</script>
